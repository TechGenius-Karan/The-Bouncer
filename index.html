<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Bouncer — daily word puzzle" />
    <meta name="theme-color" content="#F1E7D5" />
    <!-- Dark mode is shelved for now (not needed yet) — kept commented out,
         not deleted, so it's a quick re-enable later. See src/theme.ts,
         SettingsModal.tsx, AdminApp.tsx, AdminSchedulePage.tsx for the rest.
    <meta name="theme-color" content="#F1E7D5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1712" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied synchronously, before paint, so there's no flash of the
      // wrong theme while React hydrates — mirrors src/theme.ts's storage
      // key/fallback, kept inline since it must run before any module loads.
      ;(function () {
        var stored = localStorage.getItem('bouncer-theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    -->
    <title>The Bouncer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
