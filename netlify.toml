[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Server-rendered pages, so they must be matched BEFORE the SPA catch-all
# below — order matters here, Netlify takes the first rule that matches.
[[redirects]]
  from = "/archive"
  to = "/.netlify/functions/archive"
  status = 200

[[redirects]]
  from = "/archive/*"
  to = "/.netlify/functions/archive"
  status = 200

# Replaces the old static public/sitemap.xml, which could only list the home
# page. The static file was deleted; a real file would win over this rule.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
